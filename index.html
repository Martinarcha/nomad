<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOMAD</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <header>
        <nav>
            <div class="app-logo"><a href="#">NOMAD</a></div>
            <div class="navbar-actions">
                <button class="cart-button">🛒</button>
                <button class="menu-button">☰</button>
            </div>
        </nav>

        <section class="hero">
            <video autoplay muted loop src="assets/videos/hero-video.mp4"></video>

            <div class="hero-overlay"></div>
            <div class="hero-content">

                <div class="hero-text">
                    <h2>Explore beyond the familiar.</h2>
                    <p>Curated journeys for modern explorers.</p>
                </div>

                <button class="hero-cta">
                    <span class="cta-text">DISCOVER</span>
                    <span class="cta-arrow">></span>
                </button>
            </div>

        </section>
    </header>

    <main>
        <section class="experiences-section">
            <div class="experiences-grid">
                <article class="experience-card">
                    <img src="assets/images/snowboarding.jpg" alt="Snowboarding in Patagonia">
                    <div class="experience-overlay"></div>
                    <div class="experience-content">
                        <h2>Patagonia</h2>
                        <p>Winter Escape</p>
                    </div>
                </article>

                <article class="experience-card">
                    <img src="assets/images/fjord_expedition.jpg" alt="Norway fjord kayaking">
                    <div class="experience-overlay"></div>
                    <div class="experience-content">
                        <h2>Norway</h2>
                        <p>Fjord Expedition</p>
                    </div>
                </article>

            </div>
        </section>

        <section class="philosophy-section">
            <div class="philosophy-content">
                <h2>
                    Experiencies <br>
                    built with intention.
                </h2>

                <p>
                    Every journey is carefully selected to deliver
                    meaningful experiences, refined details and
                    uncompromising quality.
                </p>
            </div>

            <div class="philosophy-image">
                <img src="assets/images/philosophy_section.png" alt="Modern cabin in a foggy mountain landscape">
            </div>
        </section>



    </main>

    <footer>

    </footer>

    <script src="js/main.js"></script>
</body>

</html>
